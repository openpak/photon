name: release

# Tag a release (v1.2.3) and this publishes ghcr.io/openpak/<repo>:1.2.3 and :latest for
# amd64 and arm64. Deployed hosts run podman-auto-update against :latest, so pushing a tag
# is the deploy. The Dockerfile cross-compiles with dotnet publish -r linux-$TARGETARCH, so no QEMU build step.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # The OpenPak self-hosted runner with podman: private repositories get no
    # GitHub-hosted minutes, and the runner has no docker daemon for buildx.
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v5
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        # /tmp is a RAM disk every build on the machine shares; when it filled on
        # 2026-09-24 a compiler died and a job hung for hours instead of failing.
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - name: Stage the Fusion libs from the runner
        # Fusion's assemblies are not redistributable, so they are not in the repo; the runner
        # keeps a copy outside it. Without them the build would still succeed and publish a
        # :latest with no Fusion relay, which every AutoUpdate=registry host would pull — so a
        # missing copy fails the release instead.
        run: |
          src="${FUSION_LIBS_DIR:-$HOME/.local/share/openpak/fusion-libs}"
          for f in Fusion.Runtime.dll Fusion.Sockets.dll Fusion.Common.dll Fusion.Log.dll Fusion.Realtime.dll Photon3Unity3D.dll NanoSockets.dll libnanosockets.so; do
            [ -f "$src/$f" ] || { echo "::error::$src/$f missing: the image would have no Fusion relay (docs/fusion-shared-server.md)"; exit 1; }
          done
          rm -rf server/fusion-libs && cp -a "$src" server/fusion-libs
      # REGISTRY_AUTH_FILE lives on the steps: the runner context does not exist in
      # job-level env, and a workflow that cannot parse dispatches nothing.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
      - run: |
          set -e
          IMG="ghcr.io/${{ github.repository }}"
          case "${GITHUB_REF_NAME}" in v*) VER="${GITHUB_REF_NAME#v}";; *) VER="";; esac
          podman manifest rm "$IMG:build" 2>/dev/null || true
          podman build --platform linux/amd64,linux/arm64 --manifest "$IMG:build" .
          TAGS="latest"; [ -n "$VER" ] && TAGS="$TAGS $VER $(echo "$VER" | cut -d. -f1,2)"
          for t in $TAGS; do podman manifest push --all "$IMG:build" "docker://$IMG:$t"; done
          podman manifest rm "$IMG:build"
          echo "pushed $IMG: $TAGS"
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
      - name: Clear scratch and the staged libs
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch" server/fusion-libs
